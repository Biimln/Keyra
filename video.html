<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Video Untuk Kamu ❤️</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


    <!-- MUSIK BACKGROUND -->

    <audio id="musik" loop>

        <source src="lagu.mp3" type="audio/mpeg">

    </audio>


    <div class="halaman">

        <div class="container">

            <h1>Video Untuk Kamu ❤️</h1>

            <p class="subjudul">
                Ada satu hal lagi yang ingin aku tunjukkan...
            </p>


            <!-- VIDEO -->

            <div class="video-container">

                <video id="video" controls>

                    <source src="video.mp4" type="video/mp4">

                    Browser kamu tidak mendukung video.

                </video>

            </div>


            <div class="penutup">

                <p>
                    Semoga kamu suka dengan video kecil ini. ❤️
                </p>

                <a href="index.html" id="tombolKembali" class="tombol">
                    ← Kembali
                </a>

            </div>

        </div>

    </div>


    <script>

        const musik = document.getElementById("musik");

        const video = document.getElementById("video");

        const tombolKembali =
            document.getElementById("tombolKembali");


        /*
        ========================================
        MENGAMBIL POSISI MUSIK SEBELUMNYA
        ========================================
        */

        const posisiMusik =
            localStorage.getItem("posisiMusik");


        if (posisiMusik !== null) {

            musik.currentTime =
                parseFloat(posisiMusik);

        }


        /*
        ========================================
        MENJALANKAN MUSIK
        ========================================
        */

        musik.play().catch(function() {

            console.log(
                "Browser memerlukan interaksi pengguna untuk memutar musik."
            );

        });


        /*
        ========================================
        VIDEO DIPUTAR
        MUSIK BERHENTI
        ========================================
        */

        video.addEventListener("play", function() {

            musik.pause();

        });


        /*
        ========================================
        VIDEO DI-PAUSE
        MUSIK LANJUT
        ========================================
        */

        video.addEventListener("pause", function() {

            if (!video.ended) {

                musik.play().catch(function() {});

            }

        });


        /*
        ========================================
        VIDEO SELESAI
        MUSIK LANJUT
        ========================================
        */

        video.addEventListener("ended", function() {

            musik.play().catch(function() {});

        });


        /*
        ========================================
        SIMPAN POSISI MUSIK
        SAAT KEMBALI KE HALAMAN AWAL
        ========================================
        */

        tombolKembali.addEventListener("click", function() {

            localStorage.setItem(
                "posisiMusik",
                musik.currentTime
            );

        });


        /*
        ========================================
        SIMPAN POSISI JIKA TAB DITUTUP
        ========================================
        */

        window.addEventListener("beforeunload", function() {

            localStorage.setItem(
                "posisiMusik",
                musik.currentTime
            );

        });

    </script>

</body>
</html>
